name: issue waiting-for-reply label
# When the maintainer answers an issue, mark it "waiting for reply".
# As soon as anybody else comments, remove the mark (and any stale label).
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  label:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state == 'open' && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const commenter = context.payload.comment.user.login;
            const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR']
              .includes(context.payload.comment.author_association);

            if (isMaintainer) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['waiting for reply'] });
              core.info(`${commenter} answered -> waiting for reply`);
            } else {
              for (const name of ['waiting for reply', 'stale']) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
              core.info(`${commenter} replied -> labels removed`);
            }
